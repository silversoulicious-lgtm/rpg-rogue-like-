name: Godot Headless Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot headless binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-headless

      - name: Download Godot ${{ env.GODOT_VERSION }} headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /opt/godot
          mv "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /opt/godot/godot

      - name: Add Godot to PATH
        run: echo "/opt/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import --quit-after 60

      - name: Run smoke test
        run: godot --headless --path . res://_SmokeTest.tscn --quit-after 60
